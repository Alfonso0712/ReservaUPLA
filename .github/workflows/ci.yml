name: CI — Build & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 8 · Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias NuGet
        run: dotnet restore ReservaUpla.sln

      - name: Compilar solución en modo Release
        run: dotnet build ReservaUpla.sln --configuration Release --no-restore

      - name: Ejecutar suite de pruebas xUnit (InMemory)
        run: dotnet test ReservaUpla.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (React + Vite · Lint, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Verificar linter y reglas de accesibilidad (ESLint + jsx-a11y)
        run: npm run lint

      - name: Ejecutar suite de pruebas Vitest (modo mock)
        env:
          VITE_USAR_MOCK: "true"
        run: npm test -- --run

      - name: Compilar paquete de producción (Vite build)
        run: npm run build
